# Security Headers Configuration
# Add these to your .htaccess (Apache) or nginx.conf (Nginx) or _headers (Netlify)

# Content Security Policy
Content-Security-Policy: 
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://plausible.io;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: https: blob:;
  connect-src 'self' https://api.github.com https://plausible.io;
  media-src 'self';
  object-src 'none';
  frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
  base-uri 'self';
  form-action 'self';
  upgrade-insecure-requests;

# Security Headers
X-Content-Type-Options: nosniff
X-Frame-Options: DENY
X-XSS-Protection: 1; mode=block
Referrer-Policy: strict-origin-when-cross-origin
Permissions-Policy: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
Strict-Transport-Security: max-age=31536000; includeSubDomains; preload

# CORS Headers (if needed)
Access-Control-Allow-Origin: https://vineetkishore.dev
Access-Control-Allow-Methods: GET, HEAD, OPTIONS

# Cache Control
Cache-Control: public, max-age=31536000, immutable
